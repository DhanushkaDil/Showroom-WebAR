<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Fashion Showroom</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    #overlay { position: fixed; inset: 0; pointer-events: none; }
    #controls { position: absolute; bottom: 20px; left: 0; right: 0;
                display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
                pointer-events: auto; }
    #controls button { padding: 12px 14px; font-size: 16px; border: none;
                       border-radius: 10px; background: rgba(255,255,255,.85); }
    #hint { position: absolute; top: 12px; left: 0; right: 0; text-align: center;
            font: 14px sans-serif; color: #fff; text-shadow: 0 0 4px #000; }
  </style>
</head>
<body>
  <a-scene
    renderer="alpha: true"
    xr-mode-ui="XRMode: ar"
    webxr="optionalFeatures: dom-overlay, local-floor; overlayElement: #overlay">

    <!-- The showroom. Change the position/scale values to place it. -->
    <a-entity id="room" position="0 0 -3" scale="1 1 1">
      <a-entity gltf-model="FashionShowroom_v1.glb"></a-entity>
    </a-entity>

    <a-light type="ambient" intensity="1"></a-light>

    <!-- Camera = your phone in AR. On desktop you can preview with WASD + mouse. -->
    <a-entity camera position="0 1.6 0" look-controls wasd-controls></a-entity>
  </a-scene>

  <div id="overlay">
    <div id="hint">Tap the AR button, then use the buttons to place the showroom</div>
    <div id="controls">
      <button data-a="move" data-x="-0.25" data-z="0">⬅</button>
      <button data-a="move" data-x="0.25" data-z="0">➡</button>
      <button data-a="move" data-x="0" data-z="0.25">Closer</button>
      <button data-a="move" data-x="0" data-z="-0.25">Farther</button>
      <button data-a="rotate" data-v="15">↻</button>
      <button data-a="rotate" data-v="-15">↺</button>
      <button data-a="scale" data-v="1.1">＋ Size</button>
      <button data-a="scale" data-v="0.9">－ Size</button>
      <button data-a="height" data-v="0.1">▲</button>
      <button data-a="height" data-v="-0.1">▼</button>
    </div>
  </div>

  <script>
    const room = document.getElementById('room').object3D;
    document.querySelectorAll('#controls button').forEach(b => {
      b.addEventListener('click', () => {
        const a = b.dataset.a;
        if (a === 'move')   { room.position.x += +b.dataset.x; room.position.z += +b.dataset.z; }
        if (a === 'rotate') { room.rotation.y += THREE.MathUtils.degToRad(+b.dataset.v); }
        if (a === 'scale')  { room.scale.multiplyScalar(+b.dataset.v); }
        if (a === 'height') { room.position.y += +b.dataset.v; }
      });
    });
  </script>
</body>
</html>
