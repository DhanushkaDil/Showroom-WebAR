<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR Fashion Showroom</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    #overlay { position: fixed; inset: 0; pointer-events: none; }
    #hint { position: absolute; top: 16px; left: 16px; right: 16px; text-align: center;
            font: 16px sans-serif; color: #fff; text-shadow: 0 0 4px #000; }
  </style>
</head>
<body>
  <a-scene
    renderer="alpha: true"
    xr-mode-ui="XRMode: ar"
    webxr="optionalFeatures: hit-test, dom-overlay, local-floor; overlayElement: #overlay">

    <!-- Showroom: hidden until you tap to place it -->
    <a-entity id="room" visible="false">
      <a-entity gltf-model="FashionShowroom_v1.glb" scale="1 1 1"></a-entity>
    </a-entity>

    <!-- Floor detector: shows a ring on the floor; tap to place the room there -->
    <a-entity ar-hit-test="target: #room; type: footprint"></a-entity>

    <a-light type="ambient" intensity="1"></a-light>
    <a-entity camera></a-entity>
  </a-scene>

  <div id="overlay">
    <div id="hint">Point your phone at the floor, then tap where the showroom entrance should be</div>
  </div>

  <script>
    const hint = document.getElementById('hint');
    const scene = document.querySelector('a-scene');
    scene.addEventListener('ar-hit-test-select', () => {
      document.getElementById('room').setAttribute('visible', true);
      hint.style.display = 'none';
    });
  </script>
</body>
</html>
